# cargo-about's settings for THIRD-PARTY-LICENSES (`make third-party-licenses`): the licence
# texts of every crate the shipped binaries are built from. Dev and build dependencies never
# reach a binary, and the workspace's own crates (`publish = false`) are svolder itself, under
# LICENSE. Both release architectures are listed, so a crate only one of them builds is covered.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The same licences as scripts/check-licenses.py's ALLOWED, whose self-test fails when the two
# differ. The order is the preference among a crate's alternatives: MIT and Apache-2.0 first.
accepted = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
