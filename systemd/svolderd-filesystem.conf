# Opt-in drop-in for svolderd.service: a read-only file system except where the daemon writes.
# Needs systemd 254 or later and a host that lets a user manager create user namespaces.
# Copy it to ~/.config/systemd/user/svolderd.service.d/filesystem.conf (docs/usage/daemon.md).

[Service]
# The whole file system is read-only, the home included, except the paths listed below.
ProtectSystem=strict
ProtectHome=read-only
# /proc/sys, /sys and the control groups are read-only.
ProtectKernelTunables=yes
ProtectControlGroups=yes
# Writable: the configuration directory (config.toml, the computer EQ's files, its user unit and
# autostart entry; a missing one is skipped) and the runtime directory (socket, lock, pid file).
# Add a --config or --socket directory elsewhere here.
ReadWritePaths=-%E %t
# Created before the daemon starts and left writable: the state directory (tokens, host-eq.toml).
# The daemon keeps it 0700, so the mode below changes nothing for a directory it made.
StateDirectory=svolder
StateDirectoryMode=0700
# Created and left writable too: the cache directory (AutoEq's index, fetched over HTTPS).
CacheDirectory=svolder
CacheDirectoryMode=0700
