[package]
name = "svolder-sim"
description = "Serve the fake Schiit Forkbeard device as a real BLE peripheral"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "svolder-sim"
path = "src/main.rs"

[dependencies]
bluer.workspace = true
clap.workspace = true
# The same D-Bus crates bluer builds on, for the advertisement object bluer cannot express.
dbus = { workspace = true, features = ["futures"] }
dbus-crossroads = "0.5"
dbus-tokio.workspace = true
futures.workspace = true
tokio = { workspace = true }
svolder-proto.workspace = true
svolder-profiles.workspace = true
svolder-fake.workspace = true

# A musl build is the static release binary (`make static`): libdbus is built in from the
# source libdbus-sys bundles rather than linked from the system.
[target.'cfg(target_env = "musl")'.dependencies]
dbus = { workspace = true, features = ["vendored"] }
