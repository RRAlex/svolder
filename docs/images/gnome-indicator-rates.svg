<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" role="img" aria-label="The eight sample-rate colours of the indicator box: 44.1 kHz light grey, 48 white, 88.2 pale blue, 96 blue, 176.4 violet, 192 magenta, 352.8 rose, 384 coral; other rates plain">
<rect width="520" height="150" rx="10" fill="#2b2b2b"/>
<g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#d0d0d0">
<rect x="21.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#cfcfcf" stroke-width="4"/><circle cx="59" cy="37" r="4" fill="#8ff0a4"/><text x="45" y="76">44.1</text>
<rect x="83.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#ffffff" stroke-width="4"/><circle cx="121" cy="37" r="4" fill="#8ff0a4"/><text x="107" y="76">48</text>
<rect x="145.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#b8d8ff" stroke-width="4"/><circle cx="183" cy="37" r="4" fill="#8ff0a4"/><text x="169" y="76">88.2</text>
<rect x="207.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#86b4ff" stroke-width="4"/><circle cx="245" cy="37" r="4" fill="#8ff0a4"/><text x="231" y="76">96</text>
<rect x="269.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#a58aff" stroke-width="4"/><circle cx="307" cy="37" r="4" fill="#8ff0a4"/><text x="293" y="76">176.4</text>
<rect x="331.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#d476f0" stroke-width="4"/><circle cx="369" cy="37" r="4" fill="#8ff0a4"/><text x="355" y="76">192</text>
<rect x="393.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#f27aa8" stroke-width="4"/><circle cx="431" cy="37" r="4" fill="#8ff0a4"/><text x="417" y="76">352.8</text>
<rect x="455.5" y="22" width="48" height="30" rx="7" fill="none" stroke="#ff8c72" stroke-width="4"/><circle cx="493" cy="37" r="4" fill="#8ff0a4"/><text x="479" y="76">384</text>
<text x="260" y="96" font-size="11" fill="#a0a0a0">sample rate in kHz</text>
<rect x="21.5" y="108" width="30" height="20" rx="5" fill="none" stroke="#e6e6e6" stroke-width="3"/><text x="64" y="123" text-anchor="start">other rates: plain</text>
</g></svg>
