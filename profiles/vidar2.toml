schema = 1
name = "vidar2"
display = "Vidar 2"
product_id = 5
min_firmware = 0
extends = "amp-standby"

# The amp's meter scale; unconfirmed on a real amp (see known-issues).
[[control]]
id = [20, 1]
key = "meter_1"
label = "Meter L"
kind = "meter"
channel = "L"
scale = { zero = 50, full = 1000, class_a = 0.10 }

[[control]]
id = [20, 2]
key = "meter_2"
label = "Meter R"
kind = "meter"
channel = "R"
scale = { zero = 50, full = 1000, class_a = 0.10 }
