schema = 1
name = "aegir2"
display = "Aegir 2"
product_id = 6
min_firmware = 0
extends = "amp-standby"

# The amp's meter scale; unconfirmed on a real amp (see known-issues).
[[control]]
id = [20, 1]
key = "meter_1"
label = "Meter L"
kind = "meter"
channel = "L"
scale = { zero = 160, full = 350, class_a = 0.25 }

[[control]]
id = [20, 2]
key = "meter_2"
label = "Meter R"
kind = "meter"
channel = "R"
scale = { zero = 160, full = 350, class_a = 0.25 }
