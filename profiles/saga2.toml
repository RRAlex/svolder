schema = 1
name = "saga2"
display = "Saga 2"
product_id = 12
min_firmware = 0
extends = "preamp-common"

[[control]]
id = [2]
key = "input"
label = "Input"
kind = "select"
values = { 1 = "Input 1", 2 = "Input 2", 3 = "Input 3", 4 = "Input 4" }

[[control]]
id = [3]
key = "mode"
label = "Mode"
kind = "select"
values = { 1 = "Passive", 2 = "Low Gain", 3 = "High Gain" }
output_gain = true

[[control]]
id = [5]
key = "headphone"
label = "Headphone output"
kind = "readout"
value_type = "bool"

[[control]]
id = [6]
key = "volume"
label = "Volume"
kind = "level"
range = [0, 63]
unit = "dB"
convert = { linear = [-64.0, 0.0] }

[[control]]
id = [10]
key = "power"
label = "Power"
kind = "readout"
value_type = "bool"

[[control]]
id = [230, 2]
key = "fault_headphone"
label = "Headphone fault"
kind = "fault"
advice = "Unplug the headphones, power-cycle the device, and check the cable for shorts."
