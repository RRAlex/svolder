schema = 1
name = "skoll"
display = "Skoll"
product_id = 15
min_firmware = 0
extends = "phono-common"

[[control]]
id = [3]
key = "gain"
label = "Gain"
kind = "select"
values = { 1 = "40 dB", 2 = "50 dB", 3 = "60 dB", 4 = "70 dB" }
output_gain = true

[[control]]
id = [5]
key = "headphone"
label = "Headphone output"
kind = "readout"
value_type = "bool"

[[control]]
id = [2]
key = "input"
label = "Input"
kind = "select"
values = { 1 = "Balanced", 2 = "Single-Ended" }

[[control]]
id = [11, 1]
key = "load_capacitance"
label = "Load capacitance"
kind = "select"
values = { 1 = "50 pF", 2 = "100 pF", 3 = "150 pF", 4 = "200 pF" }

[[control]]
id = [11, 2]
key = "load_resistance"
label = "Load resistance"
kind = "select"
values = { 1 = "10 Ω", 2 = "50 Ω", 3 = "100 Ω", 4 = "150 Ω", 5 = "47 kΩ" }
