# The fake's own device: a stereo power amplifier that exists only in the simulator and the
# in-process fake. Its meters are the reason it exists: they carry the Aegir 2's scale, so a level
# between silence and full scale becomes a raw reading and a front end has something moving to
# draw that reads like an Aegir 2, without a real amp on the bench.
schema = 1
name = "fake-amp"
display = "Fake amp"
extends = "amp-stereo"
# A product id no Schiit device carries, so nothing on the air can be taken for this.
product_id = 65534

[[control]]
id = [4]
key = "mute"
label = "Mute"
kind = "toggle"
mutes_output = true

[[control]]
id = [20, 1]
key = "meter_1"
label = "Meter L"
kind = "meter"
channel = "L"
scale = { zero = 160, full = 350, class_a = 0.25 }

[[control]]
id = [20, 2]
key = "meter_2"
label = "Meter R"
kind = "meter"
channel = "R"
scale = { zero = 160, full = 350, class_a = 0.25 }
