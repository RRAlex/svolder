# The fake's own device: a five-meter amplifier that exists only in the simulator and the
# in-process fake, so a front end with more than two channels to draw has something moving to
# test against without a real multichannel amp on the bench. Its meters carry the Kraken's
# scale, so something moving to draw reads like a Kraken.
schema = 1
name = "fake-five"
display = "Fake five"
extends = "amp-stereo"
# A product id no Schiit device carries, so nothing on the air can be taken for this.
product_id = 65532

[[control]]
id = [4]
key = "mute"
label = "Mute"
kind = "toggle"
mutes_output = true

[[control]]
id = [20, 1]
key = "meter_1"
label = "Meter 1"
kind = "meter"
channel = "1"
scale = { zero = 30, full = 600, class_a = 0.10 }

[[control]]
id = [20, 2]
key = "meter_2"
label = "Meter 2"
kind = "meter"
channel = "2"
scale = { zero = 30, full = 600, class_a = 0.10 }

[[control]]
id = [20, 3]
key = "meter_3"
label = "Meter 3"
kind = "meter"
channel = "3"
scale = { zero = 30, full = 600, class_a = 0.10 }

[[control]]
id = [20, 4]
key = "meter_4"
label = "Meter 4"
kind = "meter"
channel = "4"
scale = { zero = 30, full = 600, class_a = 0.10 }

[[control]]
id = [20, 5]
key = "meter_5"
label = "Meter 5"
kind = "meter"
channel = "5"
scale = { zero = 30, full = 600, class_a = 0.10 }
