schema = 1
name = "lokimax"
display = "Loki Max"
product_id = 23
min_firmware = 0
family = "preamp"

[[control]]
id = [2]
key = "input"
label = "Input"
kind = "select"
values = { 1 = "XLR", 2 = "RCA" }

[[control]]
id = [3]
key = "mode"
label = "Mode"
kind = "select"
values = { 1 = "Process", 2 = "Bypass" }
asks_on_change = true

# Band gain in steps of 1 dB of the slider: raw 15 is 0 dB. The app writes 6.<band>.3 from its
# slider and 6.<band> from its predefined settings, and reads a band from either, so each band
# reads its two-id form (and any third id under it) as well as its own.
[[control]]
id = [6, 1, 3]
key = "band1"
label = "20 Hz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-12.0, 12.0] }
reads = [[6, 1]]

[[control]]
id = [6, 2, 3]
key = "band2"
label = "120 Hz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-9.0, 9.0] }
reads = [[6, 2]]

[[control]]
id = [6, 3, 3]
key = "band3"
label = "550 Hz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-6.0, 6.0] }
reads = [[6, 3]]

[[control]]
id = [6, 4, 3]
key = "band4"
label = "2 kHz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-6.0, 6.0] }
reads = [[6, 4]]

[[control]]
id = [6, 5, 3]
key = "band5"
label = "6 kHz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-9.0, 9.0] }
reads = [[6, 5]]

[[control]]
id = [6, 6, 3]
key = "band6"
label = "20 kHz"
kind = "level"
range = [0, 30]
unit = "dB"
convert = { linear = [-12.0, 12.0] }
reads = [[6, 6]]

# The device keeps three slots: a recall (7.2.<slot>) makes the device report its bands, a save
# (7.1.<slot>) writes the current bands over the slot. Neither carries a value.
[[control]]
id = [7, 2]
key = "recall"
label = "Recall preset"
kind = "action"
slots = 3
changes = ["band1", "band2", "band3", "band4", "band5", "band6"]

[[control]]
id = [7, 1]
key = "save"
label = "Save preset"
kind = "action"
slots = 3
overwrites = true

# The five settings the app offers, each written to the bands as 6.<band>: raw steps, 15 is 0 dB.
[builtin_settings]
keys = ["band1", "band2", "band3", "band4", "band5", "band6"]
ids = [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5], [6, 6]]
settings = [
  { name = "Flat",         raw = [15, 15, 15, 15, 15, 15] },
  { name = "Bass Boost",   raw = [28, 21, 17, 15, 15, 15] },
  { name = "Treble Boost", raw = [15, 15, 15, 17, 21, 28] },
  { name = "Smiley",       raw = [23, 16, 8, 8, 16, 23] },
  { name = "Loudness",     raw = [30, 22, 18, 15, 23, 28] },
]
