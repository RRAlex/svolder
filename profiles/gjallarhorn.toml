schema = 1
name = "gjallarhorn"
display = "Gjallarhorn"
product_id = 17
min_firmware = 0
extends = "amp-stereo"

# The app writes this one; the other amps only show the relay.
[[control]]
id = [4]
key = "mute"
label = "Mute"
kind = "toggle"
mutes_output = true

# The over-current fault comes per channel, on a third id: svolder reads channels 1 and 2, and
# a plain 230.1 raises no fault.
[[control]]
id = [230, 1, 1]
key = "fault_overcurrent"
label = "Over-current L"
kind = "fault"
advice = "Power-cycle the device. Check for shorts in speakers or headphones if it continues."

[[control]]
id = [230, 1, 2]
key = "fault_overcurrent_r"
label = "Over-current R"
kind = "fault"
advice = "Power-cycle the device. Check for shorts in speakers or headphones if it continues."

# The amp's meter scale; unconfirmed on a real amp (see known-issues).
[[control]]
id = [20, 1]
key = "meter_1"
label = "Meter L"
kind = "meter"
channel = "L"
scale = { zero = 10, full = 373, class_a = 0.10 }

[[control]]
id = [20, 2]
key = "meter_2"
label = "Meter R"
kind = "meter"
channel = "R"
scale = { zero = 10, full = 373, class_a = 0.10 }
