[package]
name = "svolder-autoeq"
description = "The AutoEq index: search, cache and download of headphone corrections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The HTTP client (ureq, rustls): the daemon's, nobody else's.
net = ["dep:thiserror", "dep:ureq", "dep:rustls", "dep:rustls-native-certs"]
# A loopback HTTP server (`test_server`) for the tests of the crates that hold a `Client`.
test-server = ["net"]

[dependencies]
percent-encoding.workspace = true
thiserror = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
