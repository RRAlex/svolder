[package]
name = "svolder-speakers"
description = "Virtual speakers: the dataset catalogue, the SOFA and WAV converter, the store of converted sets and the fetch client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The HTTP client (ureq, rustls) and the zip reader: the daemon's, nobody else's.
net = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs", "dep:zip"]
# A loopback HTTP server (`svolder_autoeq::test_server`) for the fetch tests.
test-server = ["net", "dep:svolder-autoeq", "svolder-autoeq/test-server"]

[dependencies]
# SHA-256 of every source and converted file (a checksum, not a secret).
ring.workspace = true
serde.workspace = true
# Only the `hdf` module: the pure Rust HDF5 reader the SOFA files are read through.
sofar.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
svolder-autoeq = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# The tests of the network side run in a plain `-p svolder-speakers` too.
svolder-speakers = { path = ".", features = ["net", "test-server"] }

[[example]]
name = "catalogue_check"
required-features = ["net"]
