name: Feature request
description: Something svolder could do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it solves for you.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      multiple: true
      options:
        - TUI
        - CLI
        - Web UI
        - Daemon
        - MCP
        - Home Assistant / MQTT
    validations:
      required: true
