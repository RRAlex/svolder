# DORMANT until go-public: this workflow only runs when someone starts it by hand
# (`workflow_dispatch`), and nothing has. The go-public step adds
#   push:
#     tags: ['v*']
# under `on:` (and `make workflow-check` is then changed to expect it).
#
# It builds the release on GitHub's own runners, one native build per architecture (no
# emulation), and publishes it:
#   build     `make packages ARCH=...` on x86_64 and on arm64; contents: read, no token while it builds
#   image     the Docker image on each architecture, from that build's tarball (packages: write)
#   manifest  joins the two images as ghcr.io/rralex/svolder:VERSION
#   release   the only job that writes the release: combines both builds (`make release-files`),
#             writes the compose file and the notes, attaches everything to a draft, checks the
#             draft against SHA256SUMS, publishes it, and deletes the draft if any step fails
# A failed run leaves no release behind (images already pushed stay on ghcr).
#
# The images are tagged VERSION (both architectures) and, because each architecture is built on
# its own runner, VERSION-amd64 and VERSION-arm64. There is no :latest on purpose: owners pin a
# version.
#
# The clones: a private repository needs the token, which is given to the clone step alone and
# passed as `git -c http.extraheader=... clone`, so it is never written to .git/config. After
# go-public the repository is public and the clones need no token at all.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, as in Cargo.toml (0.25.4); the tag is v plus this'
        required: true
        type: string

# Every job asks for what it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case $VERSION in ''|*[!0-9.]*) echo "bad version: $VERSION"; exit 1;; esac
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone -q "https://github.com/$GITHUB_REPOSITORY" src
          git -C src checkout -q "$GITHUB_SHA"
          [ "$(sed -n 's/^version = "\(.*\)"$/\1/p' src/Cargo.toml | head -n 1)" = "$VERSION" ] \
            || { echo "Cargo.toml's version is not $VERSION"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] \
            || { echo "start it on the tag: --ref v$VERSION"; exit 1; }
      - name: Build this architecture's packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make -C src packages ARCH="$ARCH"
      - name: Keep the files for the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.arch }}
          path: |
            src/target/dist/svolder_*.deb
            src/target/dist/svolder-*.rpm
            src/target/dist/svolder-*-linux.tar.gz
            src/target/dist/svolder-*-source.tar.gz
            src/target/dist/THIRD-PARTY-LICENSES
          if-no-files-found: error

  image:
    needs: build
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            tag: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            tag: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone -q "https://github.com/$GITHUB_REPOSITORY" src
          git -C src checkout -q "$GITHUB_SHA"
      - name: Fetch this architecture's build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets-${{ matrix.arch }}
          path: dl
      - name: Build the image from the tarball's binaries and push it
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # The Dockerfile's context: the tarball's binaries and licences where it expects them.
          tar -xzf "dl/svolder-$VERSION-$ARCH-linux.tar.gz" -C dl
          t="dl/svolder-$VERSION-$ARCH-linux"
          mkdir -p ctx/target/dist
          cp "$t/svolder" "$t/svolderd" "$t/THIRD-PARTY-LICENSES" ctx/target/dist/
          cp "$t/LICENSE" ctx/
          epoch=$(git -C src log -1 --format=%ct)
          image=ghcr.io/rralex/svolder
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f src/Dockerfile --build-arg "VERSION=$VERSION" \
            --build-arg "SOURCE_DATE_EPOCH=$epoch" \
            --build-arg "CREATED=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$image:$VERSION-$TAG" ctx
          docker push "$image:$VERSION-$TAG"

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the two images under the version's tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/rralex/svolder
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"

  release:
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    # The only job that writes the release, and it runs no build code.
    permissions:
      contents: write
    steps:
      - name: Check out the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case $VERSION in ''|*[!0-9.]*) echo "bad version: $VERSION"; exit 1;; esac
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone -q "https://github.com/$GITHUB_REPOSITORY" src
          git -C src checkout -q "$GITHUB_SHA"
          [ "$GITHUB_REF" = "refs/tags/v$VERSION" ] \
            || { echo "start it on the tag: --ref v$VERSION"; exit 1; }
      - name: Fetch both architectures' files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          merge-multiple: true
          path: src/target/dist
      - name: Combine them, write the compose file and the notes
        run: |
          set -euo pipefail
          make -C src release-files
          sh src/packaging/release-compose.sh "$VERSION" src/target/dist/docker-compose.yml
          # The notes end with the Docker lines.
          {
            echo
            sed -e '/^<!--$/,/^-->$/d' -e "s|@VERSION@|$VERSION|g" src/packaging/release-docker.md.in | sed '/./,$!d'
          } >> src/target/dist/RELEASE-NOTES.md
      - name: Attach everything to a draft and check it
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd src/target/dist
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f "tag_name=v$VERSION" \
            -f "target_commitish=$GITHUB_SHA" -f "name=svolder $VERSION" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # SHA256SUMS lists every asset but itself: upload the list's files, it and the compose file.
          files=$(awk '{print $2}' SHA256SUMS | tr -d '*')
          bash ../../packaging/release-ci.sh upload "$id" $files SHA256SUMS docker-compose.yml
          bash ../../packaging/release-ci.sh download "$id" ../../../check
          (cd ../../../check && sha256sum -c SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false \
            -F body=@src/target/dist/RELEASE-NOTES.md > /dev/null
      - name: Delete the draft after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          # Only a draft: a published release (a failed step after Publish) is left alone.
          if [ -n "$RELEASE_ID" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
