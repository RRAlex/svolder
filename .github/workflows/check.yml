# `make check` on an arm64 runner, the release runner's own conditions: a system D-Bus and no
# BlueZ. It runs on every push to main, by hand, and as the `test` job of release.yml, where
# `github.sha` is the caller's, the tagged commit.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Every job asks for what it needs; nothing is granted by default.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone -q "https://github.com/$GITHUB_REPOSITORY" src
          git -C src checkout -q "$GITHUB_SHA"
      - name: Install what make check needs
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential pkg-config libdbus-1-dev python3-yaml dbus
          # The same compiler as the release container (packaging/Dockerfile.build).
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Run the test suite
        run: |
          set -euo pipefail
          make -C src check
