# A private PipeWire for the host checks: no sound card, no D-Bus, no session
# manager of its own (the launcher starts a private WirePlumber beside it).
# Only a null sink exists, so nothing here can reach a real output.
context.properties = {
    core.name = svolder-e2e-0
    core.daemon = true
    log.level = 2
    support.dbus = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-access
      args = { access.socket = { svolder-e2e-0 = "unrestricted" svolder-e2e-0-manager = "unrestricted" } } }
]

context.objects = [
    { factory = spa-node-factory
      args = { factory.name = support.node.driver
               node.name = Dummy-Driver
               node.group = pipewire.dummy
               priority.driver = 20000 } }
    { factory = adapter
      args = { factory.name = support.null-audio-sink
               node.name = svolder_e2e_sink
               node.description = "svolder e2e sink"
               media.class = Audio/Sink
               audio.position = [ FL FR ]
               object.linger = true
               priority.session = 1000
               adapter.auto-port-config = { mode = dsp monitor = true control = false position = preserve }
               monitor.channel-volumes = true } }
]
