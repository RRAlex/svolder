# The pipe sinks of host-e2e phase B (bits.py), run as one client of the PRIVATE PipeWire: each module is
# a sink whose converter hands what a device would receive to a FIFO. bits.py replaces @RUN@ with the run
# directory and starts `pipewire -c` on the result; it never starts this file against anything else.
# Every sink is stereo and 48 kHz (one is 44.1 kHz); they differ only in the format and in one fault each, which is the
# point: a sink that adds a fault must stop the bits being exact.
context.properties = {
    core.daemon = false
    log.level = 2
    support.dbus = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # The clean sinks: three formats, nothing in the converter.
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s16.pipe"
               audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s16 node.description = "bits S16LE" } } }
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s24.pipe"
               audio.format = S24LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s24 node.description = "bits S24LE" } } }
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s32.pipe"
               audio.format = S32LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s32 node.description = "bits S32LE" } } }

    # A 44.1 kHz sink: with allowed-rates [ 44100 48000 ] the graph follows a 44.1 kHz stream into it, until
    # clock.force-rate says otherwise.
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s24_44.pipe"
               audio.format = S24LE audio.rate = 44100 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s24_44 node.description = "bits S24LE 44.1 kHz" } } }

    # The faulty sinks (negative controls): dither by method, dither by noise, a filter graph.
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s16_tri.pipe"
               audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s16_tri node.description = "bits S16LE triangular dither"
                                dither.method = triangular } } }
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s16_noise.pipe"
               audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s16_noise node.description = "bits S16LE dither noise 4"
                                dither.method = none dither.noise = 4 } } }
    { name = libpipewire-module-pipe-tunnel
      args = { tunnel.mode = sink pipe.filename = "@RUN@/bits_s16_graph.pipe"
               audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ]
               stream.props = { node.name = bits_s16_graph node.description = "bits S16LE filter graph"
                                audioconvert.filter-graph.0 = "{ nodes = [ { type = builtin name = g label = mixer control = { \"Gain 1\" = 0.5 } } ] inputs = [ \"g:In 1\" ] outputs = [ \"g:Out\" ] }" } } }
]
