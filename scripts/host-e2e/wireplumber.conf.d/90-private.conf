# The private WirePlumber of the host checks: policy only, no hardware.
# Feature names are those of wireplumber.conf 0.5 (`hardware.*` pull in every
# monitor; the rest need D-Bus, which the private run does not have).
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
    support.portal-permissionstore = disabled
    script.client.access-portal = disabled
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
