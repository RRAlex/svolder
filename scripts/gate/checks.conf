#
# The slow checks `make gate` runs, and what each one's result depends on (read by gate.sh).
#
# One check a line, five fields split on `|` (so no field may contain a `|`, a `||` included):
#   NAME | STAMP | PARAMS | COMMAND | PATHS
#   STAMP   yes: a pass is stamped and a later gate with the same key reuses it.
#           no:  always runs (a fresh lab run; a check that keeps a result cache of its own).
#   PARAMS  the check's own parameters, part of the key; expanded by the shell, so ${RUNS:-5000}
#           takes the caller's RUNS. Anything that changes what the command does belongs here.
#   COMMAND run from the repository root by sh; expanded by the shell too.
#   PATHS   repository paths (files or directories) whose git tree hashes at HEAD are the key.
#           A change under one is a rerun; a change elsewhere is not. Missing paths count as absent.
#
# Every Rust check also depends on Cargo.toml, Cargo.lock, .cargo and (through gate.sh) the rustc
# version: a lockfile, a flag in .cargo/config.toml or a toolchain change can move any result.
# The Makefile and scripts/gate are listed everywhere, since the command and the gate itself live there.
#
# How the lists were derived (read the code, not a guess):
#   * `make test` lists `.`, the whole tree. A first list of directories missed files the tests read
#     (README.md, Dockerfile, docker-compose*.yml, every scripts/**/*.sh via the env-var table check,
#     scripts/web-checks/node/fixtures/*.json), and a hand-kept list of what a workspace test run
#     reads is not safe: it reruns on any commit, and is reused only on the same commit and tree.
#     It runs as make check runs it: on a private bus with no BlueZ when dbus-daemon is installed.
#   * the crate graph is each crates/*/Cargo.toml's and bins/*/Cargo.toml's `svolder-*` dependencies:
#     svolder-host -> svolder-profiles (-> svolder-proto), svolder-speakers (-> svolder-autoeq);
#   * `include_str!`/`include_bytes!` in crates/ and bins/ reach web/, systemd/, profiles/ and
#     tests/fixtures; tests also open docs/usage, docs/design, docs/protocol.md, systemd/, packaging/
#     and scripts/ files (grep for those prefixes in the .rs files); see the first bullet.
#   * the preamp lab is `cargo test -p svolder-host --lib -- --ignored the_lab_finds_nothing...`:
#     the host crate and the four crates it builds on, and nothing else (the lib's own
#     tests need no docs, no bins). tui-harness and host-e2e were checked the same way: no include
#     or runtime read of docs/, README or other scripts.
#   * host-e2e builds svolderd and two svolder-host examples and runs scripts/host-e2e on a private
#     PipeWire: the whole Rust tree, its own scripts, and the PipeWire version as a parameter.
#   * the web gate keeps a finer per-check cache (scripts/web-checks/fingerprint.py: file hashes
#     of what each check loads, browsers' versions). The gate does not stamp it a second time;
#     it runs `make web-checks` and the web gate's own cache reuses what it can, which the table
#     reports as "n cached".

test | yes | tests=$(command -v dbus-daemon >/dev/null && echo private-bus) | if command -v dbus-daemon >/dev/null; then $GMAKE check-tests-private; else $GMAKE test && $GMAKE check-no-bluez; fi | .
preamp-lab | yes | SEED=${SEED:-1000} RUNS=${RUNS:-5000} | $GMAKE preamp-lab SEED=${SEED:-1000} RUNS=${RUNS:-5000} | crates/svolder-host crates/svolder-profiles crates/svolder-proto crates/svolder-speakers crates/svolder-autoeq profiles scripts/tmp-base.sh Cargo.toml Cargo.lock .cargo Makefile scripts/gate
preamp-lab-fresh | no | fresh seed each run | $GMAKE preamp-lab SEED=$(date +%s) RUNS=${RUNS:-5000} | crates/svolder-host
tui-harness | yes | pty | $GMAKE tui-harness | crates bins profiles systemd scripts/tmp-base.sh Cargo.toml Cargo.lock .cargo Makefile scripts/gate
host-e2e | yes | pipewire=$(pipewire --version 2>/dev/null) wireplumber=$(wireplumber --version 2>/dev/null) python=$(python3 -c 'import sys,numpy; print(sys.version, numpy.__version__)' 2>/dev/null) | $GMAKE host-e2e | crates bins profiles scripts/host-e2e scripts/tmp-base.sh Cargo.toml Cargo.lock .cargo Makefile scripts/gate
web-checks | no | own result cache | $GMAKE web-checks | crates bins profiles scripts/web-checks
